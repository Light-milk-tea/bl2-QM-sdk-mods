[project]
name = "weak_point_lock"
version = "1.7.0"
authors = [{ name = "Light-milk-tea" }]
description = "镜头不动。手持枪开火时锁定准星附近的敌人，打向它自己的弱点。群战时优先锁离准星最近的一只。F8 开关。"

[project.dependencies]
willow2_mod_manager = ">=3.0"

[tool.sdkmod]
name = "弱点锁定"
license = {name = "MIT", url = "https://choosealicense.com/licenses/mit/"}
supported_games = ["BL2"]
coop_support = "HostOnly"
