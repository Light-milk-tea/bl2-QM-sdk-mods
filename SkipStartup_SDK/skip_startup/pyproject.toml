[project]
name = "skip_startup"
version = "1.2.1"
authors = [{ name = "Light-milk-tea" }]
description = """
启动时跳过 2K、Gearbox、版权页和存档图标页。DLC 检查和 SHiFT 登录仍会照常进行。
剧情过场不受影响。
"""

[project.dependencies]
willow2_mod_manager = ">=3.0"

[tool.sdkmod]
name = "跳过游戏启动动画"
license = {name = "MIT", url = "https://choosealicense.com/licenses/mit/"}
supported_games = ["BL2"]
coop_support = "ClientSide"
