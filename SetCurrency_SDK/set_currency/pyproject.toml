[project]
name = "set_currency"
version = "1.0.2"
authors = [{ name = "Light-milk-tea" }]
description = """
在游戏里把当前角色的金钱、铱矿、炽天使水晶和托格代币改成菜单里的数量。
只改本机这个角色。黄金钥匙和狂霸点数不在这里。
"""

[project.dependencies]
willow2_mod_manager = ">=3.0"

[tool.sdkmod]
name = "调整货币"
license = {name = "MIT", url = "https://choosealicense.com/licenses/mit/"}
supported_games = ["BL2"]
coop_support = "ClientSide"
