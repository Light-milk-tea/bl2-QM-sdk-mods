[project]
name = "ime_fix"
version = "1.0.0"
authors = [{ name = "Light-milk-tea" }]
description = "游戏在前台时自动切到英语(美国)键盘，切出游戏、关掉模组或退出游戏时换回原来的输入法。需要系统里装有英语(美国)键盘。游戏里要打中文，可以自己按 Win+空格 切回。"

[project.dependencies]
willow2_mod_manager = ">=3.0"

[tool.sdkmod]
name = "输入法兼容修复"
license = {name = "MIT", url = "https://choosealicense.com/licenses/mit/"}
supported_games = ["BL2"]
coop_support = "ClientSide"
